Name: budgetmatch-sim
Host: 0.0.0.0
Port: 10001
Timeout: 600000
MaxBytes: 524288000

# 认证中心 RPC（admin 不直接访问 DB，所有数据操作通过 auth-rpc）
AuthRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: auth.rpc
  Endpoints:
    - 127.0.0.1:10003
  NonBlock: true

# 秒杀服务 RPC
SeckillRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: seckill.rpc
  Endpoints:
    - 127.0.0.1:10004
  NonBlock: true

# 商城服务 RPC
MallRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: mall.rpc
  Endpoints:
    - 127.0.0.1:10005
  NonBlock: true
