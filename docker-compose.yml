version: "3.8"

services:
  # etcd 服务注册与配置中心
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: budgetmatch-sim-etcd
    environment:
      - ETCD_NAME=etcd-1
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
    ports:
      - "12379:2379"
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: budgetmatch-sim-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: budgetmatch-sim
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d budgetmatch-sim"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - budgetmatch-sim-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: budgetmatch-sim-redis
    command: redis-server --requirepass 12345678 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "12345678", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - budgetmatch-sim-network

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: budgetmatch-sim-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: budgetmatch-sim-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # Auth RPC 服务（gRPC，port 10003）

  auth-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/auth
        PORT: 10003
    container_name: budgetmatch-sim-auth-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=budgetmatch-sim port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - ETCD_HOSTS=etcd:2379
    ports:
      - "10003:10003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # Seckill RPC 服务（gRPC，port 10004）
  seckill-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/seckill
        PORT: 10004
    container_name: budgetmatch-sim-seckill-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=budgetmatch-sim port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - ETCD_HOSTS=etcd:2379
    ports:
      - "10004:10004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # Mall RPC 服务（gRPC，port 10005）
  mall-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/mall
        PORT: 10005
    container_name: budgetmatch-sim-mall-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=budgetmatch-sim port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - ROCKETMQ_NAMESERVERS=rocketmq-namesrv:9876
      - ETCD_HOSTS=etcd:2379
    ports:
      - "10005:10005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # Agent RPC 服务（gRPC，port 10006）

  agent-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/agent
        PORT: 10006
    container_name: budgetmatch-sim-agent-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=budgetmatch-sim port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - ETCD_HOSTS=etcd:2379
    ports:
      - "10006:10006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # Payment RPC 服务（gRPC，port 10007）
  payment-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/payment
        PORT: 10007
    container_name: budgetmatch-sim-payment-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=budgetmatch-sim port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - ETCD_HOSTS=etcd:2379
      # 支付宝沙箱密钥（从宿主 .env 注入，未配置时支付功能不可用但服务可启动）
      - ALIPAY_APP_ID=${ALIPAY_APP_ID:-}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY:-}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL:-}
      - ALIPAY_RETURN_URL=${ALIPAY_RETURN_URL:-}
    ports:
      - "10007:10007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # App 服务（REST API，port 10002）

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/app
        PORT: 10002
    container_name: budgetmatch-sim-app
    environment:
      # app 不直连数据库，所有数据操作通过 RPC
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - ETCD_HOSTS=etcd:2379
    ports:
      - "10002:10002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-rpc:
        condition: service_started
      seckill-rpc:
        condition: service_started
      mall-rpc:
        condition: service_started
      agent-rpc:
        condition: service_started
      payment-rpc:
        condition: service_started
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

  # Admin 服务（REST API，port 10001）
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/admin
        PORT: 10001
    container_name: budgetmatch-sim-admin
    environment:
      # admin 不直接访问 DB/Redis，所有数据操作通过 RPC
      - ETCD_HOSTS=etcd:2379
    ports:
      - "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-rpc:
        condition: service_started
      seckill-rpc:
        condition: service_started
      agent-rpc:
        condition: service_started
      etcd:
        condition: service_started
    networks:
      - budgetmatch-sim-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  budgetmatch-sim-network:
    driver: bridge
