Name: mall.rpc
ListenOn: 0.0.0.0:10005
Timeout: 60000

# 链路追踪；Name 非空即开启，trace_id / span_id 自动注入日志
Telemetry:
  Name: mall.rpc
  Sampler: 1.0

# 服务注册到 etcd
Etcd:
  Hosts:
    - ${ETCD_HOSTS}
  Key: mall.rpc

JwtAuth:
  Secret: "${JWT_SECRET}"
  Expire: 86400

Database:
  LogLevel: 4
  Driver: "Postgres"
  DSN: "${DATABASE_DSN}"
  MaxOpenConns: 100
  MaxIdleConns: 20
  ConnMaxLifetime: 7200s
  ConnMaxIdleTime: 300s
  AutoMigrate: true
  PrepareStmt: true

CacheRedis:
  Address: "${REDIS_ADDRESS}"
  Password: "${REDIS_PASSWORD}"
  DB: 4
  PoolSize: 10
  MinIdleConns: 5
  DialTimeout: 5s
  ReadTimeout: 3s
  WriteTimeout: 3s
  PoolTimeout: 4s
  MaxRetries: 3

RocketMQ:
  NameServers:
    - "${ROCKETMQ_NAMESERVERS}"
  GroupName: "mall-rpc"
  RetryTimes: 2
  SendMsgTimeout: 3000

ServiceAuth:
  Secret: "${PAYMENT_MALL_SERVICE_SECRET}"

# 留空时索引服务拒绝全部调用，不影响原用户接口或支付确认。
# 启用时使用独立随机密钥（至少 32 字节），必须与 Agent 的 IndexAuth 相同。
IndexAuth:
  Secret: "${AGENT_MALL_INDEX_SECRET}"

# Required for current account status / role checks on direct RPC calls.
AuthRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: auth.rpc
  NonBlock: true
  Timeout: 2000
