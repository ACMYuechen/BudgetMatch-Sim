syntax = "proto3";

package mall;
option go_package = "./pb";

/////////////////////// 基础类型 ///////////////////////
message Product {
  string id            = 1;
  string user_id       = 2;
  string name          = 3;
  string content       = 4;
  string image         = 5;
  string providor      = 6;
  int32  status        = 7;
  string agent_comment = 8;
  string created_at    = 9;
  string updated_at    = 10;
}

message Sku {
  string id            = 1;
  string product_id    = 2;
  string name          = 3;
  string specs         = 4;
  int64  price         = 5;
  int64  stock         = 6;
  int64  sold          = 7;
  int32  status        = 8;
  string agent_comment = 9;
  string created_at    = 10;
  string updated_at    = 11;
}

// ========== Product (SPU) ==========

message CreateProductReq {
  string user_id       = 1;
  string name          = 2;
  string content       = 3;
  string image         = 4;
  string providor      = 5;
  string agent_comment = 6;
}

message CreateProductResp {
  string id = 1;
}

message UpdateProductReq {
  string id            = 1;
  string name          = 2;
  string content       = 3;
  int32  status        = 4;
  string image         = 5;
  string providor      = 6;
  string agent_comment = 7;
}

message UpdateProductResp {
  bool success = 1;
}

message DeleteProductReq {
  string id = 1;
}

message DeleteProductResp {
  bool success = 1;
}

message GetProductReq {
  string id = 1;
}

message GetProductResp {
  Product product = 1;
}

message ListProductsReq {
  int32  page      = 1;
  int32  page_size = 2;
  string keyword   = 3;
  int32  status    = 4;
  string user_id   = 5;
}

message ListProductsResp {
  repeated Product list      = 1;
  int64            total     = 2;
  int32            page      = 3;
  int32            page_size = 4;
}

// ========== SKU ==========

message CreateSkuReq {
  string product_id    = 1;
  string name          = 2;
  string specs         = 3;
  int64  price         = 4;
  int64  stock         = 5;
  string agent_comment = 6;
}

message CreateSkuResp {
  string id = 1;
}

message UpdateSkuReq {
  string id            = 1;
  string name          = 2;
  string specs         = 3;
  int64  price         = 4;
  int64  stock         = 5;
  int32  status        = 6;
  string agent_comment = 7;
}

message UpdateSkuResp {
  bool success = 1;
}

message DeleteSkuReq {
  string id = 1;
}

message DeleteSkuResp {
  bool success = 1;
}

message GetSkuReq {
  string id = 1;
}

message GetSkuResp {
  Sku sku = 1;
}

message ListSkusByProductReq {
  string product_id = 1;
  int32  page       = 2;
  int32  page_size  = 3;
  int32  status     = 4;
}

message ListSkusByProductResp {
  repeated Sku list      = 1;
  int64        total     = 2;
  int32        page      = 3;
  int32        page_size = 4;
}

// ========== Order ==========

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING     = 1;
  ORDER_STATUS_PAID        = 2;
  ORDER_STATUS_SHIPPED     = 3;
  ORDER_STATUS_COMPLETED   = 4;
  ORDER_STATUS_CANCELLED   = 5;
  ORDER_STATUS_REFUNDING   = 6;
  ORDER_STATUS_REFUNDED    = 7;
}

message OrderItem {
  string product_id      = 1;
  string sku_id          = 2;
  string sku_name        = 3;
  int64  price           = 4;
  int64  quantity        = 5;
  int64  discount_amount = 6;
  int64  total_amount    = 7;
  string snapshot        = 8;
}

message Order {
  string          id              = 1;
  string          user_id         = 2;
  int64           original_amount = 3;
  int64           discount_amount = 4;
  int64           pay_amount      = 5;
  OrderStatus     status          = 6;
  string          pay_type        = 7;
  string          pay_time        = 8;
  string          remark          = 9;
  string          snapshot        = 10;
  string          idempotency_key = 11;
  repeated OrderItem items        = 12;
  string          created_at      = 13;
  string          updated_at      = 14;
}

message CreateOrderReq {
  string user_id         = 1;
  string sku_id          = 2;
  int64  quantity        = 3;
  string remark          = 4;
  string idempotency_key = 5;
}

message CreateOrderResp {
  string      order_id = 1;
  OrderStatus status   = 2;
}

message GetOrderReq {
  string order_id = 1;
  string user_id  = 2;
}

message GetOrderResp {
  Order order = 1;
}

message ListOrdersReq {
  string      user_id   = 1;
  int32       page      = 2;
  int32       page_size = 3;
  OrderStatus status    = 4;
}

message ListOrdersResp {
  repeated Order list      = 1;
  int64          total     = 2;
  int32          page      = 3;
  int32          page_size = 4;
}

message CancelOrderReq {
  string order_id = 1;
  string user_id  = 2;
}

message CancelOrderResp {
  bool success = 1;
}

message UpdateOrderStatusReq {
  string      order_id = 1;
  string      user_id  = 2;
  OrderStatus status   = 3;
}

message UpdateOrderStatusResp {
  bool success = 1;
}

message ConfirmPaymentReq {
  string order_id     = 1;
  string user_id      = 2;
  int64  amount       = 3;//精确到分，也就是小数点后两位
  string out_trade_no = 4;
  string trade_no     = 5;
}

message ConfirmPaymentResp{
  bool  success            = 1;
  int32 status             = 2;
  bool  was_already_confirmed  = 3;
}

message OrderOutboxEvent {
  string id              = 1;
  string aggregate_id    = 2;
  string event_type      = 3;
  string dedup_key       = 4;
  string topic           = 5;
  string tag             = 6;
  string message_key     = 7;
  string payload         = 8;
  int32  status          = 9;
  int32  attempts        = 10;
  int32  max_attempts    = 11;
  string next_retry_at   = 12;
  string locked_until    = 13;
  string last_error      = 14;
  int64  published_at    = 15;
  string created_at      = 16;
  string updated_at      = 17;
}

message OrderOutboxStatusCount {
  int32  status     = 1;
  string event_type = 2;
  int64  count      = 3;
}

message GetOrderOutboxStatsReq {}

message GetOrderOutboxStatsResp {
  repeated OrderOutboxStatusCount counts = 1;
  int64 oldest_pending_at = 2;
}

message ListOrderOutboxReq {
  int32  page         = 1;
  int32  page_size    = 2;
  int32  status       = 3;
  string event_type   = 4;
  string aggregate_id = 5;
  string dedup_key     = 6;
}

message ListOrderOutboxResp {
  repeated OrderOutboxEvent list = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetOrderOutboxReq {
  string id = 1;
}

message GetOrderOutboxResp {
  OrderOutboxEvent event = 1;
}

message ReplayOrderOutboxReq {
  string id = 1;
}

message ReplayOrderOutboxResp {
  bool success = 1;
}

// ========== Services ==========

service ProductService {
  rpc CreateProduct(CreateProductReq) returns (CreateProductResp) {}
  rpc UpdateProduct(UpdateProductReq) returns (UpdateProductResp) {}
  rpc DeleteProduct(DeleteProductReq) returns (DeleteProductResp) {}
  rpc GetProduct(GetProductReq) returns (GetProductResp) {}
  rpc ListProducts(ListProductsReq) returns (ListProductsResp) {}

  rpc CreateSku(CreateSkuReq) returns (CreateSkuResp) {}
  rpc UpdateSku(UpdateSkuReq) returns (UpdateSkuResp) {}
  rpc DeleteSku(DeleteSkuReq) returns (DeleteSkuResp) {}
  rpc GetSku(GetSkuReq) returns (GetSkuResp) {}
  rpc ListSkusByProduct(ListSkusByProductReq) returns (ListSkusByProductResp) {}
}

service OrderService {
  rpc CreateOrder(CreateOrderReq) returns (CreateOrderResp) {}
  rpc GetOrder(GetOrderReq) returns (GetOrderResp) {}
  rpc ListOrders(ListOrdersReq) returns (ListOrdersResp) {}
  rpc CancelOrder(CancelOrderReq) returns (CancelOrderResp) {}
  rpc UpdateOrderStatus(UpdateOrderStatusReq) returns (UpdateOrderStatusResp) {}
  rpc ConfirmPayment(ConfirmPaymentReq) returns (ConfirmPaymentResp) {}
  rpc GetOrderOutboxStats(GetOrderOutboxStatsReq) returns (GetOrderOutboxStatsResp) {}
  rpc ListOrderOutbox(ListOrderOutboxReq) returns (ListOrderOutboxResp) {}
  rpc GetOrderOutbox(GetOrderOutboxReq) returns (GetOrderOutboxResp) {}
  rpc ReplayOrderOutbox(ReplayOrderOutboxReq) returns (ReplayOrderOutboxResp) {}
}
