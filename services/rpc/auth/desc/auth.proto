syntax = "proto3";

package auth;
option go_package = "./pb";

// 用户基础信息
message User {
  string id       = 1;
  string username = 2;
  string email    = 3;
  string avatar   = 4;
  string phone    = 5;
  int32  role     = 6;
  int32  status   = 7;
}

// 用户名登录
message UsernameLoginReq {
  string username = 1;
  string password = 2;
}

// 邮箱登录
message EmailLoginReq {
  string email    = 1;
  string password = 2;
}

// 登录响应
message LoginResp {
  string token  = 1;
  string user_id = 2;
  int32  role   = 3;
}

// 邮箱注册
message EmailRegisterReq {
  string email    = 1;
  string password = 2;
  string username = 3;
  string code     = 4;
}

// 注册响应
message RegisterResp {
  bool success = 1;
}

// 验证 token
message ValidateTokenReq {
  string token = 1;
}

message ValidateTokenResp {
  User user = 1;
}

// 发送验证码
message SendCodeReq {
  string email = 1;
}

message SendCodeResp {
  bool success = 1;
}

// 验证码登录
message LoginByCodeReq {
  string email = 1;
  string code  = 2;
}

message LoginByCodeResp {
  string user_id = 1;
  string token   = 2;
  int32  role    = 3;
}

// 获取用户信息
message GetUserInfoReq {
  string user_id = 1;
}

message GetUserInfoResp {
  string user_id = 1;
  string username = 2;
  string email    = 3;
  string avatar   = 4;
  string phone    = 5;
}

// 获取个人资料
message GetUserProfileReq {
  string user_id = 1;
}

message GetUserProfileResp {
  string user_id           = 1;
  string real_name         = 2;
  string school            = 3;
  string major             = 4;
  string grade             = 5;
  int32  gender            = 6;
  string expected_city     = 7;
  string expected_position = 8;
  string self_introduction = 9;
}

// 更新个人资料
message UpdateUserProfileReq {
  string user_id           = 1;
  string real_name         = 2;
  string school            = 3;
  string major             = 4;
  string grade             = 5;
  int32  gender            = 6;
  string expected_city     = 7;
  string expected_position = 8;
  string self_introduction = 9;
}

message UpdateUserProfileResp {
  bool success = 1;
}

// ========== 管理后台接口 ==========

// 用户列表请求
message ListUsersReq {
  int32  page     = 1;
  int32  page_size = 2;
  int32  status   = 3;
  int32  role     = 4;
}

// 用户列表项
message UserListItem {
  string user_id    = 1;
  string username   = 2;
  string email      = 3;
  string phone      = 4;
  int32  role       = 5;
  int32  status     = 6;
  string avatar     = 7;
  string created_at = 8;
}

// 用户列表响应
message ListUsersResp {
  repeated UserListItem list      = 1;
  int64                  total    = 2;
  int32                  page     = 3;
  int32                  page_size = 4;
}

// 用户详情请求
message GetUserDetailReq {
  string user_id = 1;
}

message GetUserDetailResp {
  string user_id    = 1;
  string username   = 2;
  string email      = 3;
  string phone      = 4;
  int32  role       = 5;
  int32  status     = 6;
  string avatar     = 7;
  string created_at = 8;
  string updated_at = 9;
}

// 更新用户状态请求
message UpdateUserStatusReq {
  string user_id = 1;
  int32  status  = 2;
}

message UpdateUserStatusResp {
  bool success = 1;
}

// 删除用户请求
message DeleteUserReq {
  string user_id = 1;
}

message DeleteUserResp {
  bool success = 1;
}

service AuthService {
  rpc UsernameLogin(UsernameLoginReq) returns (LoginResp) {}
  rpc EmailLogin(EmailLoginReq) returns (LoginResp) {}
  rpc EmailRegister(EmailRegisterReq) returns (RegisterResp) {}
  rpc ValidateToken(ValidateTokenReq) returns (ValidateTokenResp) {}
  rpc SendCode(SendCodeReq) returns (SendCodeResp) {}
  rpc LoginByCode(LoginByCodeReq) returns (LoginByCodeResp) {}
}

service UserService {
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp) {}
  rpc GetUserProfile(GetUserProfileReq) returns (GetUserProfileResp) {}
  rpc UpdateUserProfile(UpdateUserProfileReq) returns (UpdateUserProfileResp) {}

  // 管理后台接口
  rpc ListUsers(ListUsersReq) returns (ListUsersResp) {}
  rpc GetUserDetail(GetUserDetailReq) returns (GetUserDetailResp) {}
  rpc UpdateUserStatus(UpdateUserStatusReq) returns (UpdateUserStatusResp) {}
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserResp) {}
}
