Name: seckill.rpc
ListenOn: 0.0.0.0:10004
Timeout: 60000

# 链路追踪；Name 非空即开启，trace_id / span_id 自动注入日志
Telemetry:
  Name: seckill.rpc
  Sampler: 1.0

# 服务注册到 etcd
Etcd:
  Hosts:
    - ${ETCD_HOSTS}
  Key: seckill.rpc

JwtAuth:
  Secret: "${JWT_SECRET}"
  Expire: 86400

Database:
  LogLevel: 4
  Driver: "Postgres"
  DSN: "host=127.0.0.1 user=root password=123456 dbname=budgetmatch-sim port=15432 sslmode=disable TimeZone=Asia/Shanghai"
  MaxOpenConns: 100
  MaxIdleConns: 20
  ConnMaxLifetime: 7200s
  ConnMaxIdleTime: 300s
  AutoMigrate: true
  PrepareStmt: true

CacheRedis:
  Address: "127.0.0.1:6379"
  Password: "12345678"
  DB: 3
  PoolSize: 10
  MinIdleConns: 5
  DialTimeout: 5s
  ReadTimeout: 3s
  WriteTimeout: 3s
  PoolTimeout: 4s
  MaxRetries: 3

# 商城服务 RPC（创建秒杀 SKU 时从商城预加载商品信息做快照）
MallRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: mall.rpc
  Endpoints:
    - 127.0.0.1:10005
  NonBlock: true
