Name: payment.rpc
ListenOn: 0.0.0.0:10007
Timeout: 60000

# 链路追踪；Name 非空即开启，trace_id / span_id 自动注入日志
Telemetry:
  Name: payment.rpc
  Sampler: 1.0

# 服务注册到 etcd
Etcd:
  Hosts:
    - ${ETCD_HOSTS}
  Key: payment.rpc

JwtAuth:
  Secret: "${JWT_SECRET}"
  Expire: 86400

Database:
  LogLevel: 4
  Driver: "Postgres"
  DSN: "${DATABASE_DSN}"
  MaxOpenConns: 100
  MaxIdleConns: 20
  ConnMaxLifetime: 7200s
  ConnMaxIdleTime: 300s
  AutoMigrate: true
  PrepareStmt: true

CacheRedis:
  Address: "${REDIS_ADDRESS}"
  Password: "${REDIS_PASSWORD}"
  DB: 5
  PoolSize: 10
  MinIdleConns: 5
  DialTimeout: 5s
  ReadTimeout: 3s
  WriteTimeout: 3s
  PoolTimeout: 4s
  MaxRetries: 3

ServiceAuth:
  Secret: "${PAYMENT_MALL_SERVICE_SECRET}"

# 支付宝沙箱配置（密钥统一通过环境变量注入，详见 docs/PAYMENT.md / .env.example）
Alipay:
  AppId: "${ALIPAY_APP_ID}"
  SellerId: "${ALIPAY_SELLER_ID}"
  PrivateKey: "${ALIPAY_PRIVATE_KEY}"
  AlipayPublicKey: "${ALIPAY_PUBLIC_KEY}"
  IsProduction: false
  NotifyURL: "${ALIPAY_NOTIFY_URL}"
  ReturnURL: "${ALIPAY_RETURN_URL}"

# MallRpc配置
MallRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: mall.rpc
  Endpoints:
    - 127.0.0.1:10005
  Timeout: 5000

# Required for current account status / role checks on direct RPC calls.
AuthRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: auth.rpc
  NonBlock: true
  Timeout: 2000
