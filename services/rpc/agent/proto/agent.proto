syntax = "proto3";

package agent;
option go_package = "./pb";

message RecommendReq {
  string query           = 1;
  int64  budget_cents    = 2;
  int32  max_items       = 3;
  reserved 4;
  reserved "user_id";
  string conversation_id = 5; // 多轮对话会话 ID，为空时由服务端生成并在响应中回传
  string turn_id         = 6; // 客户端生成的轮次幂等 ID，为空时由服务端生成
}

message Intent {
  int64           budget_cents = 1;
  int32           max_items    = 2;
  repeated string keywords     = 3;
  repeated string preferences  = 4;
  DemandState demand           = 5; // absent for legacy recommendation turns
}

message DemandState {
  int32 schema_version = 1;
  repeated string required = 2;
  repeated string optional = 3;
  repeated string excluded = 4;
}

message DemandConflict {
  string code = 1;
  string category = 2;
}

// Planning only: explicit, strict JSON patch; no model or product execution.
message PlanDemandReq {
  string query = 1;
  int64 budget_cents = 2;
  int32 max_items = 3;
  string conversation_id = 4;
  string turn_id = 5;
  string demand_patch = 6; // max 8192 bytes; empty inherits/initializes
}

message PlanDemandResp {
  Intent intent = 1;
  string status = 2; // intent_ready / needs_clarification, never recommendation success
  repeated DemandConflict conflicts = 3;
  string conversation_id = 4;
  string conversation_title = 5;
  string turn_id = 6;
}

// Execute an exact ready planning revision; cannot mutate demand on execution.
message ExecuteDemandReq {
  string conversation_id = 1;
  string plan_turn_id = 2;
  string turn_id = 3;
}

message DemandExecution {
  string plan_turn_id = 1;
  string strategy = 2;
  string scope = 3; // synthetic_demo_snapshot_only or mall_checked_snapshot_only; NOT a reservation
  string mapping_version = 4;
  string mapping_sha256 = 5;
  int64 snapshot_checked_at_ms = 6;
  repeated string covered_required = 7;
  repeated string missing_required = 8;
  repeated string covered_optional = 9;
  repeated string unscored_preferences = 10;
  repeated string missing_required_in_window = 11;
  bool search_limited = 12;
  int32 candidate_window = 13;
  int32 initial_expansions = 14;
  int32 final_expansions = 15;
  string initial_stop_reason = 16;
  string final_stop_reason = 17;
}

message BundleItem {
  string id          = 1;
  string name        = 2;
  string category    = 3;
  string source      = 4;
  int64  price_cents = 5;
  int64  stock       = 6;
  double score       = 7;
  string reason      = 8;
}

message ToolCall {
  string name    = 1;
  bool   success = 2;
  string detail  = 3;
}

message RecommendResp {
  Intent              intent            = 1;
  repeated BundleItem items             = 2;
  int64               total_price_cents = 3;
  string              summary           = 4;
  repeated ToolCall   tools_used        = 5;
  string              conversation_id    = 6; // 本次对话的会话 ID，客户端携带它发起下一轮
  string              conversation_title = 7; // 会话稳定展示标题
  string              turn_id             = 8; // 本轮幂等 ID
  string status = 9; // planning or explicit structured execution; absent for legacy
  repeated DemandConflict demand_conflicts = 10;
  DemandExecution execution = 11;
}

// v1 lifecycle stream; NOT model token streaming. Unknown event kinds/fields
// must be ignored. Only final contains authoritative, already persisted items.
message RecommendStreamEvent {
  uint32 schema_version = 1;
  string execution_id = 2; // unique per RPC attempt, including completed replay
  string conversation_id = 3;
  string turn_id = 4;
  uint64 sequence = 5; // starts at 1 within this execution_id
  string event = 6; // request.accepted / recommendation.final / error / done
  oneof payload {
    StreamAccepted accepted = 10;
    RecommendResp final = 11;
    StreamError error = 12;
    StreamDone done = 13;
  }
}

message StreamAccepted {} // validated identity/input and admitted new execution; not success
message StreamError {
  int64 code = 1; // public application code, never raw upstream status text/details
  string message = 2;
  bool retryable = 3; // if true, retry the SAME conversation_id/turn_id/input
}
message StreamDone {
  bool ok = 1;
  bool replayed = 2; // completed snapshot replay; not a new stock verification
}

message ConversationSummary {
  string conversation_id    = 1;
  string conversation_title = 2;
  Intent state              = 3;
  int64 turn_count          = 4;
  int64 created_at_ms       = 5;
  int64 updated_at_ms       = 6;
}

message ConversationTurn {
  string turn_id        = 1;
  int64 sequence        = 2;
  string query          = 3;
  int64 budget_cents    = 4;
  int32 max_items       = 5;
  Intent intent         = 6;
  RecommendResp result  = 7;
  int64 created_at_ms   = 8;
  int64 completed_at_ms = 9;
}

message ListConversationsReq {
  int32 page      = 1; // 从 1 开始
  int32 page_size = 2; // 1-100
}

message ListConversationsResp {
  repeated ConversationSummary list = 1;
  int32 page                         = 2;
  int32 page_size                    = 3;
  int64 total                        = 4;
}

message ListConversationTurnsReq {
  string conversation_id = 1;
  int32 page              = 2; // 从 1 开始
  int32 page_size         = 3; // 1-100
}

message ListConversationTurnsResp {
  ConversationSummary conversation = 1;
  repeated ConversationTurn list    = 2;
  int32 page                         = 3;
  int32 page_size                    = 4;
  int64 total                        = 5;
}

message DeleteConversationReq {
  string conversation_id = 1;
}

message DeleteConversationResp {
  bool deleted = 1;
}

service RecommendService {
  rpc Recommend(RecommendReq) returns (RecommendResp) {}
  // Requires a user JWT and transport deadline <= 30s. Replay emits final+done
  // only. Clients require final+done(ok=true)+OK EOF; EOF alone is not success.
  rpc RecommendStream(RecommendReq) returns (stream RecommendStreamEvent) {}
  rpc PlanDemand(PlanDemandReq) returns (PlanDemandResp) {}
  rpc ExecuteDemand(ExecuteDemandReq) returns (RecommendResp) {}
  rpc ListConversations(ListConversationsReq) returns (ListConversationsResp) {}
  rpc ListConversationTurns(ListConversationTurnsReq) returns (ListConversationTurnsResp) {}
  rpc DeleteConversation(DeleteConversationReq) returns (DeleteConversationResp) {}
}
