Name: agent.rpc
ListenOn: 0.0.0.0:10006
Timeout: 60000

Etcd:
  Hosts:
    - ${ETCD_HOSTS}
  Key: agent.rpc

Model:
  Provider: "${LLM_PROVIDER}"      # 如 openai（OpenAI 兼容接口均可）
  Model: "${LLM_MODEL}"            # 如 gpt-4.1-mini / deepseek-chat
  BaseURL: "${LLM_BASE_URL}"       # 如 https://api.openai.com/v1 或 https://api.deepseek.com/v1
  APIKey: "${LLM_API_KEY}"         # 模型服务 API 密钥

MCP:
  Enabled: false
  Command: npx
  Args:
    - "-y"
    - "@modelcontextprotocol/server-everything"
    - "stdio"
  Timeout: 5000

# 商城商品数据源；注释掉整个块则退回内存 mock 商品
MallRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: mall.rpc
  Endpoints:
    - 127.0.0.1:10005
  NonBlock: true

# 会话记忆存储；注释掉整个块则退回进程内记忆（仅限本地单实例）
CacheRedis:
  Address: "127.0.0.1:6379"
  Password: "12345678"
  DB: 6            # 2=auth 3=seckill 4=mall 5=payment 已占用
  PoolSize: 10
  MinIdleConns: 5
  DialTimeout: 5s
  ReadTimeout: 3s
  WriteTimeout: 3s
  PoolTimeout: 4s
  MaxRetries: 3

# 会话记忆行为
Memory:
  MaxHistory: 20   # 记忆窗口内保留的最大消息条数（10 轮问答），奇数向下取偶
  TTL: 24h         # 会话空闲过期时间，每次写入刷新
