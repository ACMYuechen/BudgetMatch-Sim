Name: agent.rpc
ListenOn: 0.0.0.0:10006
Timeout: 60000

# 链路追踪；Name 非空即开启，trace_id / span_id 自动注入日志
Telemetry:
  Name: agent.rpc
  Sampler: 1.0

Etcd:
  Hosts:
    - ${ETCD_HOSTS}
  Key: agent.rpc

JwtAuth:
  Secret: "${JWT_SECRET}"
  Expire: 86400

Model:
  Provider: "${LLM_PROVIDER}"      # 如 openai（OpenAI 兼容接口均可）
  Model: "${LLM_MODEL}"            # 如 gpt-4.1-mini / deepseek-chat
  BaseURL: "${LLM_BASE_URL}"       # 如 https://api.openai.com/v1 或 https://api.deepseek.com/v1
  APIKey: "${LLM_API_KEY}"         # 模型服务 API 密钥

# Embedding 模型（RAG 商品语义检索）。与 LLM 独立配置：DeepSeek 等无 embeddings 接口。
# Provider 留空则 RAG 关闭，商品检索走关键词模式。
Embedding:
  Provider: "${EMBEDDING_PROVIDER}"  # 如 openai（OpenAI 兼容接口均可）
  Model: "${EMBEDDING_MODEL}"        # 如 text-embedding-3-small
  BaseURL: "${EMBEDDING_BASE_URL}"
  APIKey: "${EMBEDDING_API_KEY}"
  Dimensions: 1536                   # 向量维度；改动会触发向量表重建与全量重嵌入

# 商品向量表所在库（复用主库）。DSN 留空则 RAG 关闭。
Database:
  LogLevel: 4
  Driver: "Postgres"
  DSN: "host=127.0.0.1 user=root password=123456 dbname=budgetmatch-sim port=15432 sslmode=disable TimeZone=Asia/Shanghai"
  MaxOpenConns: 20
  MaxIdleConns: 5
  ConnMaxLifetime: 7200s
  ConnMaxIdleTime: 300s
  AutoMigrate: true
  PrepareStmt: true

# RAG 检索与商品向量同步
RAG:
  TopK: 10                  # 向量检索召回上限
  ScoreThreshold: 0         # 余弦相似度下限[0,1]，0 不过滤
  SyncIntervalSeconds: 600  # 商品向量定时同步间隔；负数=仅启动同步一次
  SyncPageSize: 100
  VerifySku: false          # true 时检索结果逐条经 mall GetSku 实时校验

MCP:
  Enabled: false
  Command: npx
  Args:
    - "-y"
    - "@modelcontextprotocol/server-everything"
    - "stdio"
  Timeout: 5000

# LLM 文件工具。模型只能使用相对路径访问 Workspace 内文件。
FileTools:
  Workspace: "workspace/agent"
  MaxReadBytes: 1048576
  WritableExtensions:
    - ".json"
    - ".md"
    - ".txt"

# 商城商品数据源；注释掉整个块则退回内存 mock 商品
MallRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOSTS}
    Key: mall.rpc
  Endpoints:
    - 127.0.0.1:10005
  NonBlock: true

# 会话记忆存储；注释掉整个块则退回进程内记忆（仅限本地单实例）
CacheRedis:
  Address: "127.0.0.1:6379"
  Password: "12345678"
  DB: 6            # 2=auth 3=seckill 4=mall 5=payment 已占用
  PoolSize: 10
  MinIdleConns: 5
  DialTimeout: 5s
  ReadTimeout: 3s
  WriteTimeout: 3s
  PoolTimeout: 4s
  MaxRetries: 3

# 会话记忆行为
Memory:
  MaxHistory: 20   # 记忆窗口内保留的最大消息条数（10 轮问答），奇数向下取偶
  TTL: 24h         # 会话空闲过期时间，每次写入刷新
