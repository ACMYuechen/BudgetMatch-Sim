Name: agent.rpc
ListenOn: 0.0.0.0:10006
Etcd:
  Hosts:
    - ${ETCD_HOSTS}
  Key: agent.rpc

Model:
  Provider: openai
  Model: deepseek-chat
  BaseURL: https://api.deepseek.com/v1
  APIKey: ${DEEPSEEK_API_KEY}

MCP:
  Enabled: false
  Command: npx
  Args:
    - -y
    - @modelcontextprotocol/server-everything
    - stdio
  Timeout: 5000
